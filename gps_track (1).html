<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<meta name="screen-orientation" content="portrait">
<title>GPS 軌跡記錄</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155;
    --text:#f1f5f9; --sub:#94a3b8; --accent:#22c55e; --warn:#f59e0b; --red:#ef4444; --blue:#38bdf8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Noto Sans TC","Roboto",sans-serif;overflow:hidden;touch-action:manipulation}
  #app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px;gap:8px}
  header{display:flex;align-items:center;justify-content:space-between;padding-top:8px;font-size:13px;color:var(--sub)}
  #gpsStatus{display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--warn)}
  .dot.ok{background:var(--accent)} .dot.bad{background:var(--red)}
  #hdrBtns{display:flex;gap:6px}
